# Defaults shared by all profiles. Secrets and hosts come from environment variables (see deploy/.env.example).
spring.application.name=rebalance

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rebalance?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:rebalance}
spring.datasource.password=${DB_PASSWORD:rebalance}
spring.datasource.hikari.maximum-pool-size=10
# every read in a transaction sees the latest committed data (balances are derived on read)
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# the schema is owned by Flyway; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=64
spring.flyway.enabled=true

spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.forward-headers-strategy=native
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO

app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=30d
app.cors.allowed-origins=${APP_CORS_ORIGINS:}
app.storage.path=${APP_STORAGE_PATH:./data/images}

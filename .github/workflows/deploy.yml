name: Deploy

# main -> test -> arm64 image on GHCR -> SSH deploy to the Oracle Cloud VM.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deploy; queue the next one instead.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, package and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: chmod +x mvnw

      # Full test suite (incl. Testcontainers ITs) gates the deploy; produces target/*.jar.
      - name: Maven verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      # GHCR image names must be lowercase (owner is "VladKhrlmv").
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rebalance-backend" >> "$GITHUB_ENV"

      # The Dockerfile has no RUN steps, so building linux/arm64 needs no QEMU.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          # Path context (not the default git context): the image needs target/*.jar.
          context: .
          platforms: linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DEPLOY_* secrets may be environment secrets of "production" or repository secrets.
    # Optionally add required reviewers in Settings -> Environments -> production.
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rebalance/app' }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set (Settings -> Secrets and variables -> Actions, or Environments -> production)"; exit 1; fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set - trusting the host key on first use (ssh-keyscan)."
            ssh-keyscan -T 15 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$DEPLOY_PATH/deploy/deploy.sh' backend"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

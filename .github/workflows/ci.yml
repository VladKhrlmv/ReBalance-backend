name: CI

# Tests every branch and pull request. Pushes to main are tested by deploy.yml
# (which only builds/deploys when the tests pass), so they are skipped here.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    # PRs from branches of this repo are already covered by their push run; only run PR
    # events for forks, to avoid testing the same commit twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The wrapper may be committed without the executable bit (Windows checkouts).
      - run: chmod +x mvnw

      # Unit + integration tests (Testcontainers uses the runner's Docker daemon).
      - name: Maven verify
        run: ./mvnw -B -ntp verify

      # Cheap smoke test of Dockerfile + .dockerignore (COPY-only, native platform, not pushed).
      - name: Docker image builds
        run: docker build --pull -t rebalance-backend:ci .

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
